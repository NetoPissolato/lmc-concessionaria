worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    server_tokens off;

    # O token do WebSocket e outros dados sensíveis podem vir na URL de clientes antigos:
    # o log de acesso registra só o caminho, sem a query string.
    log_format sem_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log sem_query;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript
               application/xml application/rss+xml application/manifest+json image/svg+xml
               font/ttf font/otf application/vnd.ms-fontobject;

    # ── Limites de requisição (por IP) ─────────────────────────────────────────
    # login: tentativa de senha por força bruta
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    # formulários públicos: leads, avaliações, alertas (anti-spam). Só conta POST:
    # chave vazia = requisição não entra no limite (o GET das avaliações continua livre).
    map $request_method $chave_post {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $chave_post zone=publico_escrita:10m rate=6r/m;
    # API em geral
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;        # Painel de gestão (dashboard)
    }

    upstream frontend_site {
        server frontend_site:3001;   # Site público
    }

    upstream backend {
        server backend:8000;
    }

    # ── HTTP → HTTPS ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name lcm.spacerstorepaineladmin.com site.spacerstorepaineladmin.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: painel de gestão ────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name lcm.spacerstorepaineladmin.com;

        ssl_certificate /etc/letsencrypt/live/lcm.spacerstorepaineladmin.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lcm.spacerstorepaineladmin.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Atenção: add_header dentro de um location ANULA os do server.
        # Por isso cada location que tem add_header repete o bloco de segurança.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        # O painel não deve aparecer no Google (nem as cópias das páginas do site que ele também serve)
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location /_next/static/ {
            proxy_pass http://frontend;
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── HTTPS: site público ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name site.spacerstorepaineladmin.com;

        ssl_certificate /etc/letsencrypt/live/site.spacerstorepaineladmin.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/site.spacerstorepaineladmin.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Fotos dos veículos. O backend grava cada foto com nome único, então dá para
        # cachear por bastante tempo sem risco de mostrar imagem velha.
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Bloqueia rotas do dashboard no site público → redireciona pro painel
        location ~ ^/(login|dashboard) {
            return 301 https://lcm.spacerstorepaineladmin.com$request_uri;
        }

        # Formulários públicos (lead, avaliação, alerta): limite anti-spam
        location ~ ^/api/v1/public/(leads|reviews|availability-alerts) {
            limit_req zone=publico_escrita burst=4 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy para API — resolve CORS: chamadas do site vao pelo mesmo dominio
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        location /_next/static/ {
            proxy_pass http://frontend_site;
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Arquivos de /public (logo, ícones): mudam pouco
        location ~* ^/(brand|icons|logos)/ {
            proxy_pass http://frontend_site;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://frontend_site;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
