version: "3.9"

services:
  # ─── Banco de Dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lmc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lmc_veiculos
      POSTGRES_USER: lmc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LmC_Pr0d_S3cur3_2024!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmc_user -d lmc_veiculos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Cache / Filas ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lmc_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-R3d1s_LmC_2024!}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-R3d1s_LmC_2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Backend FastAPI ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lmc_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://lmc_user:${DB_PASSWORD:-LmC_Pr0d_S3cur3_2024!}@postgres:5432/lmc_veiculos
      REDIS_URL: redis://:${REDIS_PASSWORD:-R3d1s_LmC_2024!}@redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      ALLOWED_ORIGINS: https://lcm.spacerstorepaineladmin.com,https://site.spacerstorepaineladmin.com
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - internal

  # ─── Frontend Next.js ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://lcm.spacerstorepaineladmin.com/api/v1
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: lmc_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://lcm.spacerstorepaineladmin.com/api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ─── Frontend Site Público (Next.js) ─────────────────────────────────────────
  frontend_site:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL relativa — browser do visitante chama pelo mesmo dominio (nginx faz proxy pra API)
        NEXT_PUBLIC_API_URL: /api/v1
        # URL interna Docker — usada pelo Next.js Server Components (SSR/ISR)
        BACKEND_INTERNAL_URL: http://backend:8000
        PORT: "3001"
    container_name: lmc_frontend_site
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
      PORT: "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: lmc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - frontend_site
      - backend
    networks:
      - internal

  # ─── Certbot (SSL) ──────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: lmc_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  upload_data:

networks:
  internal:
    name: lmc_network
    driver: bridge
